name: Storybook CI/CD

# Deploys app/'s Storybook to Cloudflare Pages (project reforge-storybook): a push to main
# deploys production (https://storybook.reforge.ne2.studio); a pull request deploys a preview at
# <branch>.reforge-storybook.pages.dev and comments its URL on the PR.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - '.github/actions/comment-pages-preview/**'
      - 'app/**'
  pull_request:
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - '.github/actions/comment-pages-preview/**'
      - 'app/**'

permissions:
  contents: read

concurrency:
  group: storybook-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: app
          cache-dependency-path: app/package-lock.json

      - name: Verify Storybook executable specs
        working-directory: app
        run: npm run test:storybook

      - name: Build Storybook
        working-directory: app
        run: npm run build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: app/storybook-static/
          retention-days: 7

  deploy:
    needs: build
    # Pull requests from forks get no access to secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Storybook
        uses: actions/download-artifact@v7
        with:
          name: storybook-static
          path: storybook-static

      - name: Deploy Storybook
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=reforge-storybook --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: storybook
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}

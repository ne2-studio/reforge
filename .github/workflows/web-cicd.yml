name: Web CI/CD

# Deploys web/ to Cloudflare Pages (project reforge-web): a push to main deploys production
# (https://reforge.ne2.studio); a pull request deploys a preview at
# <branch>.reforge-web.pages.dev and comments its URL on the PR.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web-cicd.yml'
      - '.github/actions/comment-pages-preview/**'
      - 'web/**'
  pull_request:
    paths:
      - '.github/workflows/web-cicd.yml'
      - '.github/actions/comment-pages-preview/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo site
        working-directory: web
        # Previews use root-relative URLs so their links don't jump to production.
        run: hugo --minify --environment production ${{ github.event_name == 'pull_request' && '--baseURL /' || '' }}

      - name: Check 404 page
        # Without a top-level 404.html Pages treats the site as an SPA and answers unknown
        # paths with the home page and a 200.
        run: test -f web/public/404.html

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: web-public
          path: web/public/
          retention-days: 7

  deploy:
    needs: build
    # Pull requests from forks get no access to secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: web-production
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v7
        with:
          name: web-public
          path: public

      - name: Deploy web
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=reforge-web --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: web
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
